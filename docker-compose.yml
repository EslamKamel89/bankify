services:
  postgres:
    build:
      context: .
      dockerfile: ./backend/docker/local/postgres/Dockerfile
    restart: always
    shm_size: 128mb
    # environment:
    #   POSTGRES_USER: postgres
    #   POSTGRES_PASSWORD: postgres
    #   POSTGRES_DB: app
    env_file:
      - "./.envs/.env.local"
    volumes:
      - ./volumes/db/local:/var/lib/postgresql/data
