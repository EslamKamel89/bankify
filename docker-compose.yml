services:
  traefik:
    image: docker.io/traefik:v3.2
    restart: unless-stopped
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./backend/docker/local/traefik/traefik.yml:/etc/traefik/traefik.yml
      - ./volumes/traefik/logs:/var/log/traefik
    networks:
      - traefik
    # command:
    #   - --providers.docker

  api:
    build:
      context: .
      dockerfile: ./backend/docker/local/fastapi/Dockerfile
    volumes:
      - .:/src
      - ./backend/app/logs:/src/backend/app/logs
    ports:
      - "8000:8000"
    env_file:
      - ./.envs/.env.local
    depends_on:
      - postgres
      - traefik
      # - mailpit
      # command: /start.sh
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.routers.api.rule=Host(`api.localhost`)"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
      # future HTTPS
      # - "traefik.http.routers.api-secure.entrypoints=websecure"
      # - "traefik.http.routers.api-secure.rule=Host(`api.localhost`)"
      # - "traefik.http.routers.api-secure.tls=true"
  mailpit:
    image: docker.io/axllent/mailpit:v1.20.3
    ports:
      - "8025:8025"
      - "1025:1025"
    volumes:
      - bankify_mailpit_data:/data
    environment:
      - MP_MAX_MESSAGES=5000
      - MP_DATA_FILE=/data/mailpit.db
      - MP_SMTP_AUTH_ACCEPT_ANY=0
      - MP_SMTP_AUTH_ALLOW_UNSECURE=1
      - MP_SMTP_TLS=false
    command:
      - --smtp-auth-allow-insecure
    networks:
      - traefik

  postgres:
    build:
      context: .
      dockerfile: ./backend/docker/local/postgres/Dockerfile
    restart: always
    shm_size: 128mb
    # environment:
    #   POSTGRES_USER: postgres
    #   POSTGRES_PASSWORD: postgres
    #   POSTGRES_DB: app
    env_file:
      - "./.envs/.env.local"
    volumes:
      - ./volumes/db/local:/var/lib/postgresql/data
    networks:
      - traefik

  redis:
    image: redis:8.8-m03-trixie
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - traefik

  celery_worker:
    build:
      context: .
      dockerfile: ./backend/docker/local/fastapi/Dockerfile
    command: celery -A backend.app.core.celery_app worker --loglevel=info
    depends_on:
      - rabbitmq
      - redis
    env_file:
      - ./.envs/.env.local
    networks:
      - traefik

  flower:
    build:
      context: .
      dockerfile: ./backend/docker/local/fastapi/Dockerfile
    command: celery -A backend.app.core.celery_app flower --port=5555
    ports:
      - "5555:5555"
    depends_on:
      - rabbitmq
      - redis
    env_file:
      - ./.envs/.env.local
    networks:
      - traefik

  celery_beat:
    build:
      context: .
      dockerfile: ./backend/docker/local/fastapi/Dockerfile
    command: celery -A backend.app.core.celery_app beat --loglevel=info
    depends_on:
      - rabbitmq
      - redis
    env_file:
      - ./.envs/.env.local
    networks:
      - traefik
  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    # environment:
    # RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
    # RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - traefik

networks:
  traefik:
    driver: bridge

volumes:
  bankify_mailpit_data:
  rabbitmq_data:
