services:
  traefik:
    image: docker.io/traefik:v3.2
    restart: unless-stopped
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./backend/docker/local/traefik/traefik.yml:/etc/traefik/traefik.yml
      - ./volumes/traefik/logs:/var/log/traefik
    networks:
      - traefik
    # command:
    #   - --providers.docker

  api:
    build:
      context: .
      dockerfile: ./backend/docker/local/fastapi/Dockerfile
    volumes:
      - .:/src
      - ./backend/app/logs:/src/backend/app/logs
    ports:
      - "8000:8000"
    env_file:
      - ./.envs/.env.local
    depends_on:
      - postgres
      - traefik
      # - mailpit
      # command: /start.sh
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.routers.api.rule=Host(`api.localhost`)"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
      # future HTTPS
      # - "traefik.http.routers.api-secure.entrypoints=websecure"
      # - "traefik.http.routers.api-secure.rule=Host(`api.localhost`)"
      # - "traefik.http.routers.api-secure.tls=true"
  mailpit:
    image: docker.io/axllent/mailpit:v1.20.3
    ports:
      - "8025:8025"
      - "1025:1025"
    volumes:
      - bankfiy_mailpit_data:/data
    environment:
      - MP_MAX_MESSAGES=5000
      - MP_DATA_FILE=/data/mailpit.db
      - MP_SMTP_AUTH_ACCEPT_ANY=0
      - MP_SMTP_AUTH_ALLOW_UNSECURE=1
      - MP_SMTP_TLS=false
    command:
      - --smtp-auth-allow-insecure
    networks:
      - traefik

  postgres:
    build:
      context: .
      dockerfile: ./backend/docker/local/postgres/Dockerfile
    restart: always
    shm_size: 128mb
    # environment:
    #   POSTGRES_USER: postgres
    #   POSTGRES_PASSWORD: postgres
    #   POSTGRES_DB: app
    env_file:
      - "./.envs/.env.local"
    volumes:
      - ./volumes/db/local:/var/lib/postgresql/data
    networks:
      - traefik

networks:
  traefik:
    driver: bridge

volumes:
  bankfiy_mailpit_data:
